# Loki en mode SingleBinary sur le nœud de monitoring. Promtail est installé séparément.
backend:
  replicas: 0
chunksCache:
  enabled: true
  nodeSelector:
    monitoring: 'true'
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  tolerations:
  - effect: NoSchedule
    key: dedicated
    operator: Equal
    value: monitoring
deploymentMode: SingleBinary
gateway:
  enabled: false
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  limits_config:
    ingestion_burst_size_mb: 32
    ingestion_rate_mb: 16
    retention_period: 744h
  schemaConfig:
    configs:
    - from: '2024-01-01'
      index:
        period: 24h
        prefix: loki_index_
      object_store: filesystem
      schema: v13
      store: tsdb
  storage:
    type: filesystem
monitoring:
  lokiCanary:
    enabled: false
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
read:
  replicas: 0
resultsCache:
  enabled: true
  nodeSelector:
    monitoring: 'true'
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  tolerations:
  - effect: NoSchedule
    key: dedicated
    operator: Equal
    value: monitoring
singleBinary:
  nodeSelector:
    monitoring: 'true'
  persistence:
    enabled: true
    size: 8Gi
    storageClass: standard
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 768Mi
    requests:
      cpu: 100m
      memory: 256Mi
  tolerations:
  - effect: NoSchedule
    key: dedicated
    operator: Equal
    value: monitoring
test:
  enabled: false
write:
  replicas: 0
