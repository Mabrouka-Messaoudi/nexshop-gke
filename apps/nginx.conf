server {
  listen 443 ssl;
  server_name _;
  ssl_certificate     /etc/nginx/certs/tls.crt;
  ssl_certificate_key /etc/nginx/certs/tls.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  root /usr/share/nginx/html;
  index index.html;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "require-corp" always;
  location /env.js {
    root /usr/share/nginx/html;
  }
  location /api/ {
    proxy_pass http://api-gateway.nexshop.svc.cluster.local:9000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization $http_authorization;
  }
  location /keycloak/ {
    proxy_pass http://keycloak.nexshop.svc.cluster.local:8080/;
    proxy_set_header Host nexshop-mab.duckdns.org:30214;
    proxy_set_header X-Forwarded-Host nexshop-mab.duckdns.org:30214;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
  location /health {
    return 200 "ok";
    add_header Content-Type text/plain;
  }
}
server {
  listen 80;
  server_name _;
  return 301 https://$host:30214$request_uri;
}
