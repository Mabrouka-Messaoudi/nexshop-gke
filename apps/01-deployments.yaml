apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: mysql
  name: mysql
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: mysql
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - args:
        - --character-set-server=utf8mb4
        - --collation-server=utf8mb4_unicode_ci
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              key: root-password
              name: mysql-secret
        image: mysql:8.3.0
        imagePullPolicy: IfNotPresent
        name: mysql
        ports:
        - containerPort: 3306
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - -uroot
            - -pmysql
          failureThreshold: 3
          initialDelaySeconds: 20
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 200m
            memory: 512Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/lib/mysql
          name: mysql-data
        - mountPath: /docker-entrypoint-initdb.d
          name: mysql-init
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: mysql-data
        persistentVolumeClaim:
          claimName: mysql-pvc
      - configMap:
          defaultMode: 420
          name: mysql-init-sql
        name: mysql-init
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: notification-service
  name: notification-service
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: notification-service
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - env:
        - name: SPRING_KAFKA_BOOTSTRAP-SERVERS
          valueFrom:
            configMapKeyRef:
              key: KAFKA_BOOTSTRAP_SERVERS
              name: nexshop-config
        - name: SPRING_KAFKA_CONSUMER_PROPERTIES_SCHEMA_REGISTRY_URL
          valueFrom:
            configMapKeyRef:
              key: SCHEMA_REGISTRY_URL
              name: nexshop-config
        - name: SPRING_MAIL_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: mail-secret
        - name: SPRING_MAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: mail-secret
        - name: SPRING_MAIL_HOST
          value: mailhog
        - name: SPRING_MAIL_PORT
          value: '1025'
        - name: SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH
          value: 'false'
        - name: SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE
          value: 'false'
        - name: MANAGEMENT_ZIPKIN_TRACING_ENDPOINT
          value: http://tempo.monitoring.svc.cluster.local:9411/api/v2/spans
        - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
          value: '1.0'
        - name: MANAGEMENT_OBSERVATIONS_KEY-VALUES_APPLICATION
          value: notification-service
        - name: LOKI4J_CLIENT_HTTP_URL
          valueFrom:
            configMapKeyRef:
              key: LOKI_URL
              name: nexshop-config
        - name: SERVER_PORT
          value: '8083'
        - name: MANAGEMENT_HEALTH_MAIL_ENABLED
          value: 'false'
        - name: JAVA_OPTS
          value: -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:+UseContainerSupport
        - name: SPRING_APPLICATION_NAME
          value: notification-service
        - name: SPRING_ZIPKIN_ENABLED
          value: 'true'
        image: mabroukamessaoudi1/notification-service:latest
        imagePullPolicy: Always
        name: notification-service
        ports:
        - containerPort: 8083
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
