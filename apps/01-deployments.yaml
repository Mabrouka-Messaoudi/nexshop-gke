          protocol: TCP
        readinessProbe:
          failureThreshold: 8
          httpGet:
            path: /actuator/health
            port: 8082
            scheme: HTTP
          initialDelaySeconds: 90
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
