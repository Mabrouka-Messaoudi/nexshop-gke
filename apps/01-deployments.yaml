apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: product-service
  name: product-service
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: product-service
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
      - env:
        - name: SPRING_DATA_MONGODB_URI
          value: mongodb://root:password@mongodb:27017/product-service?authSource=admin&authMechanism=SCRAM-SHA-256
        - name: MANAGEMENT_ZIPKIN_TRACING_ENDPOINT
          value: http://tempo.monitoring.svc.cluster.local:9411/api/v2/spans
        - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
          value: '1.0'
        - name: MANAGEMENT_OBSERVATIONS_KEY-VALUES_APPLICATION
          value: product-service
        - name: LOKI_URL
          valueFrom:
            configMapKeyRef:
              key: LOKI_URL
              name: nexshop-config
        - name: JAVA_OPTS
          value: -XX:MaxRAMPercentage=60.0 -XX:InitialRAMPercentage=40.0 -XX:MaxMetaspaceSize=150m -XX:+UseContainerSupport
        - name: SPRING_APPLICATION_NAME
          value: product-service
        - name: SPRING_ZIPKIN_ENABLED
          value: 'true'
        image: mabroukamessaoudi1/product-service:latest
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /actuator/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 180
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 15
        name: product-service
        ports:
        - containerPort: 8080
          protocol: TCP
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /actuator/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 140
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 15
        resources:
          limits:
            cpu: 400m
            memory: 2Gi
          requests:
            cpu: 150m
            memory: 512Mi
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /actuator/health
            port: 8080
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 5
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      - name: loki-proxy
        image: alpine/socat
        args:
        - TCP-LISTEN:3100,fork,reuseaddr
        - TCP:loki.monitoring.svc.cluster.local:3100
        ports:
        - containerPort: 3100
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
      dnsPolicy: ClusterFirst
      initContainers:
      - command:
        - sh
        - -c
        - until nc -z mongodb 27017; do echo waiting for mongodb; sleep 3; done
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        name: wait-for-mongodb
        resources:
          limits:
            cpu: 400m
            memory: 512Mi
          requests:
            cpu: 150m
            memory: 250Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
