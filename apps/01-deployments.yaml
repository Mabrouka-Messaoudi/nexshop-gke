# Deployments NexShop (namespace nexshop) — appliqués par scripts/deploy.sh
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: api-gateway
  name: api-gateway
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - env:
        - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER-URI
          valueFrom:
            configMapKeyRef:
              key: KEYCLOAK_ISSUER_URI
              name: nexshop-config
        - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI
          value: http://keycloak:8080/realms/spring-microservices-security-realm/protocol/openid-connect/certs
        - name: MANAGEMENT_ZIPKIN_TRACING_ENDPOINT
          value: http://tempo.monitoring.svc.cluster.local:9411/api/v2/spans
        - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
          value: '1.0'
        - name: MANAGEMENT_OBSERVATIONS_KEY-VALUES_APPLICATION
          value: api-gateway
        - name: SERVER_PORT
          value: '9000'
        - name: PRODUCT_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              key: PRODUCT_SERVICE_URL
              name: nexshop-config
        - name: ORDER_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              key: ORDER_SERVICE_URL
              name: nexshop-config
        - name: INVENTORY_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              key: INVENTORY_URL
              name: nexshop-config
        - name: JAVA_OPTS
          value: -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:+UseContainerSupport
        - name: SPRING_APPLICATION_NAME
          value: api-gateway
        - name: SPRING_ZIPKIN_ENABLED
          value: 'true'
        - name: RESILIENCE4J_TIMELIMITER_INSTANCES_DEFAULT_TIMEOUTDURATION
          value: 3s
        - name: RESILIENCE4J_CIRCUITBREAKER_INSTANCES_DEFAULT_SLOWCALLDURATIONTHRESHOLD
          value: 3s
        - name: RESILIENCE4J_CIRCUITBREAKER_INSTANCES_DEFAULT_SLOWCALLRATETHRESHOLD
          value: '50'
        - name: RESILIENCE4J_CIRCUITBREAKER_INSTANCES_DEFAULT_FAILURERATETHRESHOLD
          value: '50'
        image: mabroukamessaoudi1/api-gateway:v20260427085431
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /actuator/health
            port: 9000
            scheme: HTTP
          initialDelaySeconds: 320
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        name: api-gateway
        ports:
        - containerPort: 9000
          protocol: TCP
        readinessProbe:
          failureThreshold: 5
          httpGet:
            path: /actuator/health
            port: 9000
            scheme: HTTP
          initialDelaySeconds: 300
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 400m
            memory: 768Mi
          requests:
            cpu: 150m
            memory: 128Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      initContainers:
      - command:
        - sh
        - -c
        - until nc -z keycloak 8080; do echo waiting for keycloak; sleep 5; done
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        name: wait-for-keycloak
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      - command:
        - sh
        - -c
        - until nc -z order-service 8081; do echo waiting for order-service; sleep 3; done
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        name: wait-for-order-service
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: frontend
  name: frontend
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: frontend
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - env:
        - name: API_GATEWAY_URL
          value: https://nexshop-mab.duckdns.org:30214
        - name: KEYCLOAK_URL
          value: https://nexshop-mab.duckdns.org:30214/keycloak
        image: mabroukamessaoudi1/frontend:latest
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 443
            scheme: HTTPS
          initialDelaySeconds: 15
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 1
        name: frontend
        ports:
        - containerPort: 443
          protocol: TCP
        - containerPort: 80
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: 443
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/nginx/conf.d/default.conf
          name: nginx-config
          subPath: nginx.conf
        - mountPath: /etc/nginx/certs
          name: tls-certs
          readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: frontend-nginx-config
        name: nginx-config
      - name: tls-certs
        secret:
          defaultMode: 420
          secretName: frontend-tls
---
