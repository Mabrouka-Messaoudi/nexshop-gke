apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: keycloak
  name: keycloak
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: keycloak
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - args:
        - start-dev
        - --import-realm
        env:
        - name: DB_VENDOR
          value: mysql
        - name: DB_ADDR
          value: keycloak-mysql
        - name: DB_DATABASE
          value: keycloak
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              key: db-user
              name: keycloak-secret
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: db-password
              name: keycloak-secret
        - name: KEYCLOAK_ADMIN
          valueFrom:
            secretKeyRef:
              key: admin-user
              name: keycloak-secret
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: admin-password
              name: keycloak-secret
        - name: KC_DB_POOL_MIN_SIZE
          value: '10'
        - name: KC_DB_POOL_MAX_SIZE
          value: '80'
        - name: KC_DB_POOL_INITIAL_SIZE
          value: '20'
        image: quay.io/keycloak/keycloak:24.0.1
        imagePullPolicy: IfNotPresent
        name: keycloak
        ports:
        - containerPort: 8080
          protocol: TCP
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /realms/master
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 15
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: '1'
            memory: 1536Mi
          requests:
            cpu: 400m
            memory: 512Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /opt/keycloak/data/import
          name: realm-config
      dnsPolicy: ClusterFirst
      initContainers:
      - command:
        - sh
        - -c
        - until nc -z keycloak-mysql 3306; do echo waiting for mysql; sleep 3; done
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        name: wait-for-mysql
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: keycloak-realm
        name: realm-config
---
