    protocol: TCP
    targetPort: 8080
  selector:
    app: kafka-ui
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: keycloak
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-mysql
spec:
  ports:
  - port: 3306
    protocol: TCP
    targetPort: 3306
  selector:
    app: keycloak-mysql
  type: ClusterIP
---
apiVersion: v1
