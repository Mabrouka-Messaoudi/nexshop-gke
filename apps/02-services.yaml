# Services NexShop. Le NodePort HTTPS du frontend est figé (30214) car nginx.conf
# et la redirect URI Keycloak en dépendent ; les autres NodePorts sont attribués par
# Kubernetes et retrouvés dynamiquement par les scripts.
apiVersion: v1
kind: Service
metadata:
  labels:
    app: api-gateway
  name: api-gateway
spec:
  ports:
  - name: http
    port: 9000
    protocol: TCP
    targetPort: 9000
  selector:
    app: api-gateway
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  ports:
  - name: https
    port: 443
    protocol: TCP
    targetPort: 443
    nodePort: 30214
  - name: http
    port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: frontend
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: inventory-service
  name: inventory-service
spec:
  ports:
  - name: http
    port: 8082
    protocol: TCP
    targetPort: 8082
  selector:
    app: inventory-service
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  ports:
  - name: internal
    port: 29092
    protocol: TCP
    targetPort: 29092
  - name: external
    port: 9092
    protocol: TCP
    targetPort: 9092
  selector:
    app: kafka
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
spec:
